name: ci.yml
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm # comment
      - run: |
          npm ci
          npm test
      - run: npm run build
        env:
          VITE_APP_GREETING: ${{vars.APP_GREETING}}
      - uses: actions/upload-pages-artifact@v5
        with:
          path:
            dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
