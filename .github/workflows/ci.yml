name: ci.yml
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm test

