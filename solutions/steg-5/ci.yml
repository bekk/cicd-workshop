# Fasit for steg 5 — ci.yml som bruker composite-actionen
#
# Kopier denne til .github/workflows/ci.yml (erstatt steg 4).
#
# Sammenlign med steg-4/ci.yml: to steg er blitt til ett `uses:`.
# Gevinsten er ikke at det er kortere — den er at oppsettet nå finnes
# ETT sted. Skal du bytte Node-versjon eller legge til et steg, gjør du
# det i actionen, og alle workflows som bruker den får endringen.
#
# `./` foran stien betyr "i dette repoet". GitHub leter etter
# .github/actions/setup-app/action.yml relativt til repo-rota.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Må fortsatt være først — se kommentaren i action.yml.
      - name: Hent koden
        uses: actions/checkout@v7

      - name: Sett opp appen
        uses: ./.github/actions/setup-app
        with:
          node-version: '24'

      - name: Kjør tester
        run: npm test

      - name: Bygg
        env:
          VITE_APP_GREETING: ${{ vars.APP_GREETING }}
        run: npm run build

      - name: Last opp Pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy til Pages
        id: deployment
        uses: actions/deploy-pages@v5

  comment:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Kommenter på pull requesten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment "${{ github.event.number }}" \
            --body "Bygget gikk grønt ✅ — kjøring [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
