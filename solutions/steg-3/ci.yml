# Fasit for steg 3 — ci.yml som bruker composite-actionen
#
# Kopier denne til .github/workflows/ci.yml (erstatt steg 2).
#
# Sammenlign med steg-2/ci.yml: to steg er blitt til ett `uses:`.
# Gevinsten er ikke at det er kortere — den er at oppsettet nå finnes
# ETT sted. Skal du bytte Node-versjon eller legge til et steg, gjør du
# det i actionen, og alle workflows som bruker den får endringen.
#
# `./` foran stien betyr "i dette repoet". GitHub leter etter
# .github/actions/setup-app/action.yml relativt til repo-rota.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Må fortsatt være først — se kommentaren i action.yml.
      - name: Hent koden
        uses: actions/checkout@v7

      - name: Sett opp appen
        uses: ./.github/actions/setup-app
        with:
          node-version: '24'

      - name: Kjør tester
        run: npm test

      - name: Bygg
        run: npm run build
