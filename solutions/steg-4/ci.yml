# Fasit for steg 4 — ci.yml som kaller den gjenbrukbare workflowen
#
# Kopier denne til .github/workflows/ci.yml (erstatt steg 3).
#
# Legg merke til at build-jobben ikke har `runs-on` eller `steps` lenger.
# Den har `uses:`, og peker på en hel workflow. I Actions-fanen vil du se
# den kalte workflowen som en nøstet jobb du kan klikke deg inn i.
#
# Vil du bruke denne fra et ANNET repo, bytter du `./.github/workflows/build.yml`
# mot `<brukernavn>/<repo>/.github/workflows/build.yml@v1`. Da må repoet være
# public, eller tilhøre samme organisasjon med tilgang satt opp.
#
# GITHUB_TOKEN OG PERMISSIONS
# Hver kjøring får automatisk en kortlevd token i secrets.GITHUB_TOKEN.
# `permissions:` bestemmer hva den har lov til. Å kommentere på en pull
# request krever `pull-requests: write`, så den må comment-jobben få.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      node-version: '24'

  comment:
    runs-on: ubuntu-latest
    needs: build
    # Det finnes ingen pull request å kommentere på ved en vanlig push.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      # Ingen checkout her! `gh` trenger bare å vite hvilket repo den
      # skal snakke med, og det forteller vi den med GH_REPO.
      - name: Kommenter på pull requesten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment "${{ github.event.number }}" \
            --body "${{ needs.build.outputs.test-count }} tester gikk grønt ✅ — kjøring [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
