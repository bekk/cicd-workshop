# Fasit for steg 4 — deploy til GitHub Pages med godkjenning
#
# Kopier denne til .github/workflows/deploy.yml i forken din.
# Se README.md i samme mappe for klikkingen som må gjøres i Settings.
#
# HVORFOR id-token: write?
# deploy-pages bruker OIDC: den ber GitHub om et kortlevd, signert token
# som beviser hvilken workflow i hvilket repo som kjører, og bytter det inn
# mot tilgang til Pages-APIet. Uten `id-token: write` kan ikke jobben be om
# det tokenet, og deployet feiler. Du trenger altså ingen secrets her —
# det er hele gevinsten med OIDC.
#
# HVORFOR HETER ENVIRONMENTET github-pages?
# Det er påkrevd. Pages deployer kun fra et environment med akkurat det
# navnet, så du kan ikke kalle det "prod" selv om det er dit du deployer.
# Det er derfor dette steget ikke gjenbruker environmentene fra steg 3.
# Det er en reell særegenhet ved Pages, ikke en forenkling i workshopen.
#
# HVORFOR cancel-in-progress: false?
# Vi vil ikke avbryte et deploy som er halvveis. For CI er `true` riktig
# (se bonus-steget om concurrency), men for deploy vil du at det som er
# startet skal få gjøre seg ferdig.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # URL-en dukker opp som en klikkbar lenke på kjøringen i Actions-fanen.
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hent koden
        uses: actions/checkout@v7

      # Samme oppsett som i ci.yml fra steg 2.
      - name: Sett opp Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      # Her kobles steg 3 og steg 4 sammen: variabelen fra environmentet
      # settes som miljøvariabel under bygget, og Vite baker den inn i
      # den ferdige JavaScript-fila. Den er altså låst på byggetidspunktet,
      # ikke noe som kan endres etterpå uten å bygge på nytt.
      - name: Bygg
        env:
          VITE_APP_GREETING: ${{ vars.APP_GREETING }}
        run: npm run build

      # Pakker dist/ som et artifact i det formatet deploy-pages forventer.
      - name: Last opp Pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # `id:` trengs for at environment.url over skal få tak i page_url.
      - name: Deploy til Pages
        id: deployment
        uses: actions/deploy-pages@v5
